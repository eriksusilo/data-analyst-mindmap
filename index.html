  :root {

  }
  #canvas-wrap.panning { cursor: grabbing; }

  /* HEADER */
  #header {
    position:fixed; top:0; left:0; right:0; z-index:200;
    background:var(--dark);
    border-bottom:2px solid var(--blue);
    padding:8px 20px;
    display:flex; align-items:center; gap:14px; height:44px;
  }
  #header h1 {
    font-family:'Orbitron',monospace;
    font-size:14px; font-weight:700;
    color:var(--white); letter-spacing:3px;
  }

  .badge {
    margin-left:auto;
    font-family:'Orbitron',monospace; font-size:8px;
    color:var(--yellow); border:1px solid var(--yellow);
    padding:2px 8px; letter-spacing:1px;
  }

  svg#mindmap { width:100%; height:100%; }

  /* NODE STYLES */
  .node-group {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .node-group:hover {
    filter: brightness(1.2);
  }
  .node-group.dragging {
    cursor: grabbing;
    filter: brightness(1.3) drop-shadow(0px 8px 12px rgba(0,0,0,0.3));
  }

  /* SIDE PANEL */

    position:fixed; top:54px; right:12px; z-index:150;
    background:rgba(13,27,42,0.95);
    border:1px solid var(--blue);

    font-size:8px; color:var(--yellow); letter-spacing:2px;
  }

  }

    position:relative; flex-shrink:0;
    transition:background 0.2s;
  }

    content:''; position:absolute;
    width:10px; height:10px; border-radius:5px;
    background:var(--white); top:2px; left:2px;
    transition:transform 0.2s;
  }

  .toggle-row.off .toggle-btn::after { transform:translateX(14px); background:#4A5568; }
  .toggle-row.off .toggle-dot { opacity:0.25; }
  .toggle-row.off .toggle-label { opacity:0.4; }

let fontScale = 1.0; // Untuk fitur A+ / A-

// ─── HELPER FUNCTIONS ────────────────────────────────────────────────────────
function mk(tag, attrs={}) {
  const el = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

function splitLabel(label, maxLen=16) {
  const words=label.split(' '); const lines=[]; let cur='';
  for (const w of words) {
    if ((cur+' '+w).trim().length>maxLen && cur) { lines.push(cur.trim()); cur=w; }
    else { cur=(cur+' '+w).trim(); }
  }
  if (cur) lines.push(cur.trim());
  return lines;
}

// Draw Text relative to (0,0) inside a group
function addTextCentered(g, label, fontSize, fill, fontFamily, weight, maxLen=16) {
  const parts = label.length>maxLen ? splitLabel(label,maxLen) : [label];
  const currentFontSize = fontSize * fontScale;
  const lh = currentFontSize*1.3;
  parts.forEach((p,i) => {
    const t = mk('text',{
      x: 0, 
      y: (i-(parts.length-1)/2)*lh,
      'font-size': currentFontSize, 
      'data-base-size': fontSize, // Simpan size asli untuk penskalaan A+/A-
      fill, 'font-family':fontFamily,
      'font-weight':weight, 'text-anchor':'middle',
      'dominant-baseline':'central',
      'letter-spacing': fontFamily.includes('Orbitron')?'0.5':'0'
    });
    t.textContent = p;
    g.appendChild(t);
  });
}

// Kalkulasi Path Bezier (garis melengkung)
function getCurvePath(x1, y1, x2, y2) {
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  const cp1X = (x1 + midX) / 2;
  const cp1Y = y1;
  const cp2X = (x2 + midX) / 2;
  const cp2Y = y2;
  return `M ${x1} ${y1} C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${x2} ${y2}`;
}

function updateLines() {
  links.forEach(link => {
    link.pathEl.setAttribute('d', getCurvePath(link.source.x, link.source.y, link.target.x, link.target.y));
  });
}

function addTooltip(el, title, zone, desc) {
  const tt=document.getElementById('tooltip');
  const ttT=document.getElementById('tt-title');
  const ttZ=document.getElementById('tt-zone');
  const ttB=document.getElementById('tt-body');
  const zData=ZONES[zone];
  
  el.addEventListener('mouseenter',()=>{
    if(activeNode) return; 
    ttT.textContent=title.toUpperCase();
    ttZ.textContent=zData?`// ${zData.label}`:'';
    ttZ.style.color=zData?zData.color:'#8FA3B1';
    ttB.textContent=desc;
    tt.style.display='block';
  });
  el.addEventListener('mousemove',e=>{
    if(activeNode) { tt.style.display='none'; return; }
    tt.style.left=(e.clientX+14)+'px';
    tt.style.top=(e.clientY-10)+'px';
  });
  el.addEventListener('mouseleave',()=>{ tt.style.display='none'; });
}

// ─── BUILD MINDMAP ───────────────────────────────────────────────────────────

  nodes = [];
  links = [];

  const root = mk('g',{id:'root'});

  const nodesGroup = mk('g', {id: 'nodes-group'});
  
  root.appendChild(linesGroup);
  root.appendChild(nodesGroup);

  // 1. Center Node
  const centerNode = { id: 'center', x: CX, y: CY, el: null };
  nodes.push(centerNode);

  const cw=134, ch=58;
  const cg=mk('g', {
    class: 'node-group',
    transform: `translate(${CX}, ${CY})`
  });
  cg.appendChild(mk('rect',{
    x:-cw/2-3, y:-ch/2-3, width:cw+6, height:ch+6, rx:6,
    fill:'none', stroke:'#D4A01760', 'stroke-width':'1'
  }));
  cg.appendChild(mk('rect',{
    x:-cw/2, y:-ch/2, width:cw, height:ch, rx:4,
    fill:'#0D1B2A', stroke:'#D4A017', 'stroke-width':'2.5',
    filter: 'url(#drop-shadow)'
  }));
  
  addTextCentered(cg, 'Data Analyst', 14, '#D4A017', 'Orbitron, monospace', '700', 10);

  centerNode.el = cg;
  nodesGroup.appendChild(cg);

  // 2. Process Domains and Children
  DOMAINS.forEach(domain => {
    const rad = domain.angle * Math.PI / 180;
    const dx = CX + Math.cos(rad) * domain.dist;
    const dy = CY + Math.sin(rad) * domain.dist;

    const domainNode = { id: domain.id, x: dx, y: dy, el: null, parentId: domain.id };
    nodes.push(domainNode);

    const domainContainer = mk('g', {id: `domain-container-${domain.id}`});
    if(!visible[domain.id]) domainContainer.setAttribute('display','none');
    
    const pathEl = mk('path', {
      d: getCurvePath(CX, CY, dx, dy),
      fill: 'none', stroke: domain.color, 'stroke-width': '2',
      'stroke-dasharray': '6,3', opacity: '0.6'
    });
    links.push({ source: centerNode, target: domainNode, pathEl });
    domainContainer.appendChild(pathEl);

    const parts = splitLabel(domain.label, 15);
    const dw = Math.max(parts.reduce((m,p)=>Math.max(m,p.length),0)*7.8+30, 118);
    const dh = parts.length>1 ? 46 : 32;

    const dg = mk('g', {
      class: 'node-group',
      transform: `translate(${dx}, ${dy})`
    });
    dg.appendChild(mk('rect', {
      x: -dw/2, y: -dh/2, width: dw, height: dh, rx: 4,
      fill: domain.color, stroke: domain.color, 'stroke-width': '1.5',
      filter: 'url(#drop-shadow)'
    }));
    addTextCentered(dg, domain.label, 9.5, domain.textColor, 'Orbitron, monospace', '600', 15);
    addTooltip(dg, domain.label, domain.zone, domain.desc);
    
    domainNode.el = dg;
    
    // 3. Process Children
    const cc = domain.children.length;
    const spread = Math.min(100, cc*22);

    domain.children.forEach((child, ci) => {
      const offset = (ci - (cc-1)/2) * (spread/Math.max(cc-1,1));
      const cAngle = rad + offset * Math.PI / 180;
      const cDist = child.highlight ? 120 : 135;
      const cx2 = dx + Math.cos(cAngle) * cDist;
      const cy2 = dy + Math.sin(cAngle) * cDist;

      const childNode = { id: child.id, x: cx2, y: cy2, el: null, parentId: domain.id };
      nodes.push(childNode);

      const childPathEl = mk('path',{
        d: getCurvePath(dx, dy, cx2, cy2),
        fill: 'none', stroke: domain.color, 'stroke-width': '1',
        opacity: '0.5', 'stroke-dasharray': '4,3'
      });
      links.push({ source: domainNode, target: childNode, pathEl: childPathEl });
      domainContainer.appendChild(childPathEl);

      // Child font diset 11px (sebelumnya 8.5px, naik ~30%)
      const childBaseFont = 11; 
      const cparts = splitLabel(child.label, 18);
      // Penyesuaian box multiplier dari 6.8 ke 8.5 karena font lebih besar
      const cw2 = Math.min(Math.max(cparts.reduce((m,p)=>Math.max(m,p.length),0)*8.5+24, 85), 180);
      const ch2 = cparts.length>1 ? 38 : 28;

      const fill = child.highlight ? domain.color : domain.color+'2A';
      const strokeW = child.highlight ? '2':'1';
      const tColor  = child.highlight ? domain.textColor : domain.color;

      const childG = mk('g', {
        class: 'node-group',
        transform: `translate(${cx2}, ${cy2})`
      });
      childG.appendChild(mk('rect', {
        x: -cw2/2, y: -ch2/2, width: cw2, height: ch2, rx: 3,
        fill, stroke: domain.color, 'stroke-width': strokeW,
        filter: 'url(#drop-shadow)'
      }));
      addTextCentered(childG, child.label, childBaseFont, tColor, 'Exo 2, sans-serif', child.highlight?'600':'500', 18);
      addTooltip(childG, child.label, domain.zone, child.desc);
      
      childNode.el = childG;
      domainContainer.appendChild(childG);
      
      attachDragEvent(childG, childNode);
    });

    domainContainer.appendChild(dg);
    linesGroup.appendChild(domainContainer); 
    attachDragEvent(dg, domainNode);
  });
  
  attachDragEvent(cg, centerNode);
  svg.appendChild(root);
  applyTransform();
}

// ─── DRAG & DROP LOGIC (NODES) ───────────────────────────────────────────────
function attachDragEvent(element, nodeData) {
  element.addEventListener('mousedown', (e) => {
    e.stopPropagation(); 
    activeNode = nodeData;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    nodeStartX = nodeData.x;
    nodeStartY = nodeData.y;
    element.classList.add('dragging');
    document.getElementById('tooltip').style.display = 'none'; 
  });
}

window.addEventListener('mousemove', (e) => {
  if (activeNode) {
    const dx = (e.clientX - dragStartX) / scale;
    const dy = (e.clientY - dragStartY) / scale;
    activeNode.x = nodeStartX + dx;
    activeNode.y = nodeStartY + dy;
    activeNode.el.setAttribute('transform', `translate(${activeNode.x}, ${activeNode.y})`);
    updateLines();
  }
});

window.addEventListener('mouseup', () => {
  if (activeNode) {
    activeNode.el.classList.remove('dragging');
    activeNode = null;
  }
});


// ─── SIDE PANEL TOGGLES ──────────────────────────────────────────────────────
function buildPanel() {
  const list=document.getElementById('toggle-list');
  list.innerHTML='';

  const sections={ hard:[], soft:[], context:[] };
  DOMAINS.forEach(d=> sections[d.zone].push(d));

  const sectionMeta={
    hard:    { label:'HARD SKILLS',     color:'#1A3A6B' },
    soft:    { label:'SOFT SKILLS',     color:'#006064' },
    context: { label:'CONTEXT / CAREER',color:'#4A148C' },
  };

  Object.entries(sections).forEach(([zone, domains])=>{
    const m=sectionMeta[zone];
    const sl=document.createElement('div');
    sl.className='panel-section-label';
    sl.style.color=m.color;
    sl.style.borderColor=m.color;
    sl.textContent=m.label;
    list.appendChild(sl);

    domains.forEach(domain=>{
      const row=document.createElement('div');
      row.className='toggle-row' + (visible[domain.id]?'':' off');
      row.innerHTML=`
        <div class="toggle-dot" style="background:${domain.color}"></div>
        <div class="toggle-label">${domain.label}</div>
        <div class="toggle-btn"></div>
      `;
      row.addEventListener('click',()=>{
        visible[domain.id]=!visible[domain.id];
        row.classList.toggle('off');
        const dContainer=document.getElementById(`domain-container-${domain.id}`);
        if(dContainer) dContainer.setAttribute('display', visible[domain.id]?'':'none');
      });
      list.appendChild(row);
    });
  });
}

// Show all / Hide all toggle
let allVisible=true;
document.getElementById('btn-all').addEventListener('click',()=>{
  allVisible=!allVisible;
  DOMAINS.forEach(d=>{
    visible[d.id]=allVisible;
    const dContainer=document.getElementById(`domain-container-${d.id}`);
    if(dContainer) dContainer.setAttribute('display',allVisible?'':'none');
  });
  document.querySelectorAll('.toggle-row').forEach(r=>{
    if(allVisible) r.classList.remove('off');
    else r.classList.add('off');
  });
  document.getElementById('btn-all').textContent = allVisible ? 'HIDE ALL / SHOW ALL' : 'SHOW ALL DOMAINS';
});

// ─── PAN & ZOOM (CANVAS) ─────────────────────────────────────────────────────
function applyTransform(){
  const root = document.getElementById('root');
  if(root) root.setAttribute('transform', `translate(${viewX},${viewY}) scale(${scale})`);
}

function initView(){
  scale=0.68;
  viewX=wrap.clientWidth/2 - CX*scale - 100; 
  viewY=wrap.clientHeight/2 - CY*scale;
  applyTransform();
}

// FONT SCALING LOGIC
function updateAllFonts() {
  const texts = svg.querySelectorAll('text');
  texts.forEach(t => {
    const base = parseFloat(t.getAttribute('data-base-size'));
    const newSize = base * fontScale;
    t.setAttribute('font-size', newSize);
    
    // Sesuaikan line height jika multi-line
    const lines = t.parentNode.querySelectorAll('text');
    if (lines.length > 1) {
      const idx = Array.from(lines).indexOf(t);
      const lh = newSize * 1.3;
      t.setAttribute('y', (idx - (lines.length - 1) / 2) * lh);
    }
  });
}

document.getElementById('fontUp').onclick = () => {
  fontScale = Math.min(2.0, fontScale + 0.1);
  updateAllFonts();
};
document.getElementById('fontDown').onclick = () => {
  fontScale = Math.max(0.5, fontScale - 0.1);
  updateAllFonts();
};

wrap.addEventListener('mousedown',e=>{
  if(e.target.tagName === 'svg' || e.target.id === 'canvas-wrap') {
    isPanning=true; 
    startPanX=e.clientX; 
    startPanY=e.clientY;
    startVX=viewX; 
    startVY=viewY;
    wrap.classList.add('panning');
  }
});
window.addEventListener('mousemove',e=>{
  if(isPanning) {
    viewX=startVX+e.clientX-startPanX; 
    viewY=startVY+e.clientY-startPanY;
    applyTransform();
  }
});
window.addEventListener('mouseup',()=>{ 
  isPanning=false; 
  wrap.classList.remove('panning'); 
});

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  viewX = mx - (mx - viewX) * d; 
  viewY = my - (my - viewY) * d;
  scale = Math.max(0.15, Math.min(3, scale * d));
  applyTransform();
},{passive:false});

document.getElementById('zoomIn').onclick=()=>{ scale=Math.min(3,scale*1.15); applyTransform(); };
document.getElementById('zoomOut').onclick=()=>{ scale=Math.max(0.15,scale*0.85); applyTransform(); };
document.getElementById('resetView').onclick=()=>{ fontScale=1.0; updateAllFonts(); initView(); };

// Touch events 
let lastTD=null;
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===1 && !activeNode){ 
    isPanning=true; 
    startPanX=e.touches[0].clientX; 
    startPanY=e.touches[0].clientY; 
    startVX=viewX; 
    startVY=viewY; 
  }
},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length===1 && isPanning){ 
    viewX=startVX+e.touches[0].clientX-startPanX; 
    viewY=startVY+e.touches[0].clientY-startPanY; 
    applyTransform(); 
  }
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTD){ 
      const centerTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const centerTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = svg.getBoundingClientRect();
      const mx = centerTouchX - rect.left;
      const my = centerTouchY - rect.top;
      const zoomD = d/lastTD;
      viewX = mx - (mx - viewX) * zoomD; 
      viewY = my - (my - viewY) * zoomD;
      scale=Math.max(0.15,Math.min(3,scale*zoomD)); 
      applyTransform(); 
    }
    lastTD=d;
  }
},{passive:true});
wrap.addEventListener('touchend',()=>{ isPanning=false; lastTD=null; });

// ─── INIT ────────────────────────────────────────────────────────────────────
buildMindmap();
buildPanel();
initView();
</script>
